spring.application.name=athenas-api

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}/${DB_NAME:athenas_sys}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

server.servlet.context-path=/api

api.security.token.secret=${JWT_SECRET}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

api.email.remetente=${MAIL_FROM:${MAIL_USER:nao-responda@athenassys.com}}
api.email.simulado=${EMAIL_SIMULADO:false}
