<div class="mapa-page">

  <!-- Barra superior com faixa grega + identificação da recepção -->
  <div class="top-bar">
    <div class="greek-border top"></div>
    <div class="header-info">
      <span class="mapa-label">RECEPÇÃO</span>
      <div class="avatar">
        <img src="assets/imagens/perfil-recepcao.png" alt="Ícone da recepção" class="avatar-img">
      </div>
    </div>
  </div>

  <div class="mapa-content">

    <img src="assets/imagens/pilar.png" alt="" class="pillar-decoration">

    <div class="mapa-card">

      <div class="mapa-card-header">
        <span class="titulo-secao">MESAS</span>
        <a routerLink="/recepcao/reservas" class="acao-btn acao-primaria link-reservas">
          Gerenciar reservas
        </a>
      </div>

      <p class="mapa-status" *ngIf="carregando">Carregando mesas...</p>
      <p class="mapa-erro" *ngIf="mensagemErro">{{ mensagemErro }}</p>

      <table class="mesas-tabela" *ngIf="!carregando">
        <thead>
          <tr>
            <th>Mesa</th>
            <th>Lugares</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let mesa of mesas; let i = index">

            <!-- Linha principal -->
            <tr class="mesa-linha" [class.expandida]="mesaExpandidaIndex === i">
              <td class="valor-mesa">{{ mesa.numero }}</td>
              <td>{{ mesa.capacidade }}</td>
              <td>
                <span class="status-badge" [ngClass]="statusClasse(mesa.status)">
                  {{ statusRotulo(mesa.status) }}
                </span>
              </td>
              <td class="coluna-seta">
                <button
                  type="button"
                  class="seta-btn"
                  (click)="toggleMesa(i)"
                  [attr.aria-label]="mesaExpandidaIndex === i ? 'Recolher mesa' : 'Expandir mesa'">
                  {{ mesaExpandidaIndex === i ? '^' : 'V' }}
                </button>
              </td>
            </tr>

            <!-- Linha expandida: só muda o status da mesa -->
            <tr class="mesa-expandida-linha" *ngIf="mesaExpandidaIndex === i">
              <td colspan="4">
                <div class="painel-expandido">

                  <p class="painel-titulo">Mesa {{ mesa.numero }} &middot; mudar status da mesa</p>

                  <div class="status-toggle">
                    <button
                      type="button"
                      class="status-toggle-btn"
                      [class.ativo]="mesa.status === 'OCUPADA'"
                      (click)="alterarStatusMesa(mesa, 'OCUPADA')">
                      Ocupada
                    </button>
                    <button
                      type="button"
                      class="status-toggle-btn"
                      [class.ativo]="mesa.status === 'LIVRE'"
                      (click)="alterarStatusMesa(mesa, 'LIVRE')">
                      Livre
                    </button>
                  </div>

                  <div class="painel-acoes">
                    <button type="button" class="acao-btn acao-secundaria" (click)="fecharPainel()">
                      Fechar
                    </button>
                  </div>

                </div>
              </td>
            </tr>

          </ng-container>
        </tbody>
      </table>

    </div>

  </div>

  <!-- Rodapé decorativo -->
  <div class="bottom-wrap">
    <img src="assets/imagens/pantheon-pequeno.png" alt="" class="pantheon-decoration">
    <div class="greek-border bottom"></div>
  </div>

</div>
