<div class="auth-page">

  <!-- Faixa decorativa superior (igual à página menu) -->
  <div class="greek-border top"></div>

  <div class="auth-content">

    <!-- Lado esquerdo: banner Athenas (idêntico à página menu) -->
    <div class="left-panel">
      <div class="banner">
        <img src="assets/imagens/banner-bordo.jpeg" alt="Athenas - Gestão inteligente para restaurantes" class="banner-img">
        <div class="banner-content">
          <img src="assets/imagens/logo-transparente.png" alt="Athenas - Gestão inteligente para restaurantes" class="banner-logo">
          <p class="banner-subtitle">Gestão inteligente<br>para restaurantes</p>
        </div>
      </div>
    </div>

    <!-- Direita: fundo com templo desbotado + card de autenticação -->
    <div class="auth-right">
      <img src="assets/imagens/templo-grego-g.png" alt="" class="temple-watermark">

      <div class="auth-card">
        <h1 class="auth-title">AUTENTIQUE O FUNCIONÁRIO</h1>
        <p class="auth-subtitle" *ngIf="cargoEsperado">Faça login do funcionário de <strong>{{ cargoEsperado }}</strong><br>para acessar essa área do sistema</p>
        <p class="auth-subtitle" *ngIf="!cargoEsperado">Faça login do funcionário para<br>que ele possa acessar o sistema</p>

        <img src="assets/imagens/divisor-g.png" alt="" class="divider">

        <form class="auth-form" (ngSubmit)="onEntrar()">
          <label class="field-label" for="usuario">USUÁRIO</label>
          <div class="input-group">
            <img src="assets/imagens/icone-usuario.png" alt="" class="input-icon">
            <input type="text" id="usuario" name="usuario" class="input-field" placeholder="Digite seu usuário"
                   [(ngModel)]="usuario" required>
          </div>

          <label class="field-label" for="senha">CÓDIGO</label>
          <div class="input-group">
            <img src="assets/imagens/icone-cadeado.png" alt="" class="input-icon">
            <input type="password" id="senha" name="senha" class="input-field" placeholder="Digite seu código"
                   [(ngModel)]="senha" required>
          </div>

          <div class="auth-row">
            <label class="remember-me">
              <input type="checkbox" name="lembrar" [(ngModel)]="lembrarMe">
              <span>Lembre-me</span>
            </label>
            <a href="#" class="forgot-link">Esqueceu sua senha ou usuário?</a>
          </div>

          <p class="erro-msg" *ngIf="mensagemErro">{{ mensagemErro }}</p>

          <button type="submit" class="auth-button" [disabled]="carregando">
            {{ carregando ? 'ENTRANDO...' : 'ENTRAR' }}
          </button>
        </form>
      </div>
    </div>

  </div>

  <!-- Faixa inferior -->
  <div class="greek-border bottom"></div>

</div>
