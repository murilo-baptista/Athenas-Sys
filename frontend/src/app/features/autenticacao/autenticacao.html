<div class="auth-page">

  <!-- Faixa decorativa superior (igual à página menu) -->
  <div class="greek-border top"></div>

  <div class="auth-content">

    <!-- Lado esquerdo: banner Athenas (idêntico à página menu) -->
    <div class="left-panel">
      <div class="banner">
        <img src="assets/imagens/banner-bordo.jpeg" alt="Athenas - Gestão inteligente para restaurantes" class="banner-img">
        <div class="banner-content">
          <div class="banner-logo-placeholder">logo<br>transparente</div>
          <h2 class="banner-title">ATHENAS</h2>
          <p class="banner-subtitle">Gestão inteligente<br>para restaurantes</p>
        </div>
      </div>
    </div>

    <!-- Direita: fundo com templo desbotado + card de autenticação -->
    <div class="auth-right">
      <img src="assets/imagens/templo-grego-g.png" alt="" class="temple-watermark">

      <div class="auth-card">
        <h1 class="auth-title">AUTENTIQUE O FUNCIONÁRIO</h1>
        <p class="auth-subtitle">Faça login do funcionário para<br>que ele possa acessar o sistema</p>

        <img src="assets/imagens/divisor-g.png" alt="" class="divider">

        <form class="auth-form">
          <label class="field-label" for="usuario">USUÁRIO</label>
          <div class="input-group">
            <img src="assets/imagens/icone-usuario.png" alt="" class="input-icon">
            <input type="text" id="usuario" class="input-field" placeholder="Digite seu usuário">
          </div>

          <label class="field-label" for="senha">SENHA</label>
          <div class="input-group">
            <img src="assets/imagens/icone-cadeado.png" alt="" class="input-icon">
            <input type="password" id="senha" class="input-field" placeholder="Digite sua senha">
          </div>

          <div class="auth-row">
            <label class="remember-me">
              <input type="checkbox">
              <span>Lembre-me</span>
            </label>
            <a href="#" class="forgot-link">Esqueceu sua senha ou usuário?</a>
          </div>

          <button type="submit" class="auth-button">ENTRAR</button>
        </form>
      </div>
    </div>

  </div>

  <!-- Faixa decorativa inferior (igual à página menu, com ícone de talheres no centro) -->
  <div class="greek-border bottom">
    <span class="utensils-icon">
      <svg viewBox="0 0 40 30" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="15" r="10" fill="none" stroke="#C9A46A" stroke-width="1.6"/>
        <g stroke="#C9A46A" stroke-width="1.6" stroke-linecap="round">
          <line x1="7" y1="3" x2="7" y2="12"/>
          <line x1="4.5" y1="3" x2="4.5" y2="9"/>
          <line x1="9.5" y1="3" x2="9.5" y2="9"/>
          <line x1="7" y1="12" x2="7" y2="27"/>
          <path d="M33 3 C30 6 30 10 33 12 L33 27" fill="none"/>
        </g>
      </svg>
    </span>
  </div>

</div>
