<div class="login-page">

  <!-- Faixa decorativa superior -->
  <div class="greek-border top"></div>

  <div class="login-content">

    <!-- Lado esquerdo: templo + banner Athenas -->
    <div class="left-panel">
      <div class="temple-bg">
        <img src="assets/imagens/templo-grego.png" alt="Templo grego" class="temple-img">
      </div>
      <div class="banner">
        <img src="assets/imagens/banner-bordo.jpeg" alt="Athenas - Gestão inteligente para restaurantes" class="banner-img">
        <div class="banner-content">
          <div class="banner-logo-placeholder">logo<br>transparente</div>
          <h2 class="banner-title">ATHENAS</h2>
          <p class="banner-subtitle">Gestão inteligente<br>para restaurantes</p>
        </div>
      </div>
    </div>

    <!-- Lado direito: card de login -->
    <div class="right-panel">
      <div class="login-card">

        <h1 class="card-title">BEM VINDO DE VOLTA!</h1>
        <p class="card-subtitle">Faça login para acessar o sistema</p>

        <img src="assets/imagens/divisor-g.png" alt="" class="divider">

        <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">

          <label class="field-label" for="usuario">USUÁRIO</label>
          <div class="input-wrapper">
            <img src="assets/imagens/icone-usuario.png" alt="" class="input-icon">
            <input
              id="usuario"
              name="usuario"
              type="text"
              placeholder="Digite seu usuário"
              [(ngModel)]="usuario"
              required
            >
          </div>

          <label class="field-label" for="senha">SENHA</label>
          <div class="input-wrapper">
            <img src="assets/imagens/icone-cadeado.png" alt="" class="input-icon">
            <input
              id="senha"
              name="senha"
              type="password"
              placeholder="Digite sua senha"
              [(ngModel)]="senha"
              required
            >
          </div>

          <div class="form-row">
            <label class="remember-me">
              <input type="checkbox" name="lembrar" [(ngModel)]="lembrarMe">
              Lembre-me
            </label>
            <a href="#" class="forgot-link" (click)="onForgotPassword($event)">Esqueceu sua senha ou usuário?</a>
          </div>

          <button type="submit" class="btn-entrar">ENTRAR</button>

          <img src="assets/imagens/divisor-g.png" alt="" class="divider small">

          <p class="first-access">Primeiro acesso?</p>

          <button type="button" class="btn-cadastro" (click)="onRegister()">
            <img src="assets/imagens/icone-usuario-plus.png" alt="" class="btn-icon">
            CADASTRE-SE
          </button>

        </form>
      </div>
    </div>

  </div>

  <!-- Faixa decorativa inferior -->
  <div class="greek-border bottom"></div>

</div>
