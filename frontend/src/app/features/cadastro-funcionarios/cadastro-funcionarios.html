<div class="wizard-page">

  <!-- Faixa decorativa superior -->
  <div class="greek-border top"></div>

  <div class="wizard-content">

    <!-- Lado esquerdo: banner Athenas (idêntico à página de autenticação) -->
    <div class="left-panel">
      <div class="banner">
        <img src="assets/imagens/banner-bordo.jpeg" alt="Athenas - Gestão inteligente para restaurantes" class="banner-img">
        <div class="banner-content">
          <div class="banner-logo-placeholder">logo<br>transparente</div>
          <h2 class="banner-title">ATHENAS</h2>
          <p class="banner-subtitle">Gestão inteligente<br>para restaurantes</p>
        </div>
      </div>
    </div>

    <!-- Direita: fundo com templo desbotado + card do wizard -->
    <div class="wizard-right">
      <img src="assets/imagens/templo-grego-g.png" alt="" class="temple-watermark">

      <div class="wizard-card">

        <!-- Indicador de etapas -->
        <div class="steps-indicator">
          <div class="step-circle is-done">✓</div>
          <div class="step-line"></div>
          <div class="step-circle is-done">✓</div>
          <div class="step-line"></div>
          <div class="step-circle is-current">3</div>
        </div>
        <p class="step-caption">ETAPA 3 DE 3 · <strong>FUNCIONÁRIOS</strong></p>

        <h1 class="wizard-title">CADASTRE SEUS FUNCIONÁRIOS</h1>
        <p class="wizard-subtitle">Adicione a equipe que vai acessar o sistema.<br>Você pode adicionar mais depois.</p>

        <img src="assets/imagens/divisor-g.png" alt="" class="divider">

        <form class="wizard-form" (ngSubmit)="finalizar()">

          <label class="field-label" for="nome-funcionario">NOME DO FUNCIONÁRIO</label>
          <div class="input-group">
            <img src="assets/imagens/icone-usuario.png" alt="" class="input-icon">
            <input type="text" id="nome-funcionario" class="input-field" placeholder="Nome completo"
                   name="nomeFuncionario" [(ngModel)]="nomeFuncionario">
          </div>

          <label class="field-label" for="senha-funcionario">SENHA</label>
          <div class="input-group">
            <img src="assets/imagens/icone-cadeado.png" alt="" class="input-icon">
            <input type="password" id="senha-funcionario" class="input-field" placeholder="Senha de acesso"
                   name="senhaFuncionario" [(ngModel)]="senhaFuncionario">
          </div>

          <label class="cargo-label">CARGO</label>
          <div class="cargo-grid">
            <div class="cargo-option"
                 *ngFor="let cargo of cargos"
                 [class.is-selected]="cargoSelecionado === cargo.label"
                 (click)="selecionarCargo(cargo.label)">
              <img [src]="'assets/imagens/' + cargo.icone" [alt]="cargo.label">
              <span>{{ cargo.label }}</span>
            </div>
          </div>

          <button type="button" class="add-button" [disabled]="!nomeFuncionario || !cargoSelecionado" (click)="adicionarFuncionario()">
            + Adicionar funcionário à lista
          </button>

          <label class="added-label">FUNCIONÁRIOS ADICIONADOS</label>
          <div class="added-list">
            <div class="added-item" *ngFor="let funcionario of funcionarios">
              <span class="item-name">{{ funcionario.nome }}</span>
              <span class="badge" [ngClass]="funcionario.badgeClass">{{ funcionario.cargo }}</span>
            </div>
          </div>

          <div class="wizard-footer">
            <button type="button" class="btn btn-outline" (click)="voltar()">← VOLTAR</button>
            <button type="submit" class="btn btn-solid" [disabled]="funcionarios.length === 0">FINALIZAR CADASTRO ✓</button>
          </div>

        </form>
      </div>
    </div>

  </div>

  <!-- Faixa decorativa inferior -->
  <div class="greek-border bottom">
    <span class="utensils-icon">
      <svg viewBox="0 0 40 30" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="15" r="10" fill="none" stroke="#C9A46A" stroke-width="1.6"/>
        <g stroke="#C9A46A" stroke-width="1.6" stroke-linecap="round">
          <line x1="7" y1="3" x2="7" y2="12"/>
          <line x1="4.5" y1="3" x2="4.5" y2="9"/>
          <line x1="9.5" y1="3" x2="9.5" y2="9"/>
          <line x1="7" y1="12" x2="7" y2="27"/>
          <path d="M33 3 C30 6 30 10 33 12 L33 27" fill="none"/>
        </g>
      </svg>
    </span>
  </div>

</div>
