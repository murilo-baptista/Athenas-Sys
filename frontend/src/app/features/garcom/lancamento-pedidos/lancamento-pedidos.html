<div class="garcom-page">

  <!-- Barra superior com faixa grega + identificação do garçom -->
  <div class="top-bar">
    <div class="greek-border top"></div>
    <div class="header-info">
      <span class="garcom-label">GARÇOM: {{ nomeGarcom }}</span>
      <div class="avatar">
        <img src="assets/imagens/perfil-garçom.png" alt="Foto do garçom" class="avatar-img">
      </div>
    </div>
  </div>

  <div class="garcom-content">

    <img src="assets/imagens/pilar.png" alt="" class="pillar-decoration">

    <div class="garcom-card">

      <!-- Abas -->
      <div class="tabs">
        <button type="button" class="tab-btn" [class.active]="abaAtiva === 'novo'" (click)="abaAtiva = 'novo'">
          NOVO PEDIDO
        </button>
        <button type="button" class="tab-btn" [class.active]="abaAtiva === 'andamento'" (click)="abaAtiva = 'andamento'">
          PEDIDOS EM ANDAMENTO
        </button>
      </div>

      <!-- ===================== ABA: NOVO PEDIDO ===================== -->
      <div class="tab-panel" *ngIf="abaAtiva === 'novo'">

        <label class="field-label" for="mesa">NÚMERO DA MESA:</label>
        <select id="mesa" class="mesa-select" [(ngModel)]="mesaSelecionada">
          <option [ngValue]="null" disabled selected>-</option>
          <option *ngFor="let mesa of mesasDisponiveis" [ngValue]="mesa">{{ mesa }}</option>
        </select>

        <label class="field-label" for="pedido">ANOTE SEU NOVO PEDIDO:</label>
        <textarea
          id="pedido"
          class="pedido-textarea"
          [(ngModel)]="pedidoTexto"
          placeholder="Ex: 1 Filé de frango grelhado, 1 Lata de refrigerante...">
        </textarea>

        <div class="form-actions">
          <button
            type="button"
            class="enviar-btn"
            [disabled]="!mesaSelecionada || !pedidoTexto.trim()"
            (click)="enviarPedido()">
            ENVIAR PEDIDO PARA A COZINHA
          </button>
        </div>

      </div>

      <!-- ================= ABA: PEDIDOS EM ANDAMENTO ================= -->
      <div class="tab-panel andamento-panel" *ngIf="abaAtiva === 'andamento'">

        <!-- Filtros laterais -->
        <div class="filtros">
          <button
            type="button"
            class="filtro-btn"
            *ngFor="let filtro of filtros"
            [class.active]="filtroAtivo === filtro.valor"
            (click)="filtroAtivo = filtro.valor">
            {{ filtro.rotulo }}
          </button>
        </div>

        <!-- Lista de pedidos -->
        <div class="pedidos-lista">

          <div class="pedido-vazio" *ngIf="pedidosFiltrados().length === 0">
            Nenhum pedido nesta categoria.
          </div>

          <div class="pedido-card" *ngFor="let pedido of pedidosFiltrados()">

            <!-- Informações do pedido -->
            <div class="pedido-info">
              <div class="pedido-info-header">
                <span>Mesa</span>
                <span>Pedido</span>
                <span>Itens</span>
                <span>Enviado em</span>
              </div>
              <div class="pedido-info-valores">
                <span class="valor-mesa">{{ pedido.mesa }}</span>
                <span>#{{ pedido.numero }}</span>
                <span>{{ pedido.itens.length }}</span>
                <span>{{ pedido.horarioEnvio }}</span>
              </div>
              <ul class="pedido-itens">
                <li *ngFor="let item of pedido.itens">- {{ item }}</li>
              </ul>
            </div>

            <!-- Status do pedido -->
            <div class="pedido-status">

              <div class="status-main">

                <div class="status-steps">

                  <!-- Passo 1: Novo -->
                  <div class="status-step" [ngClass]="'estado-' + stepEstado(pedido, 0)">
                    <span class="status-sphere" aria-hidden="true"></span>
                    <span class="status-icon status-icon-novo" aria-hidden="true"></span>
                    <span class="status-rotulo">Novo</span>
                  </div>

                  <div class="status-linha" [ngClass]="'estado-' + linhaEstado(pedido, 0)"></div>

                  <!-- Passo 2: Em andamento -->
                  <div class="status-step" [ngClass]="'estado-' + stepEstado(pedido, 1)">
                    <span class="status-sphere" aria-hidden="true"></span>
                    <span class="status-icon status-icon-andamento" aria-hidden="true"></span>
                    <span class="status-rotulo">Em andamento</span>
                  </div>

                  <div class="status-linha" [ngClass]="'estado-' + linhaEstado(pedido, 1)"></div>

                  <!-- Passo 3: Pronto -->
                  <div class="status-step" [ngClass]="'estado-' + stepEstado(pedido, 2)">
                    <span class="status-sphere" aria-hidden="true"></span>
                    <span class="status-icon status-icon-pronto" aria-hidden="true"></span>
                    <span class="status-rotulo">Pronto</span>
                  </div>

                  <!-- Linha final: vira seta quando o pedido está pronto -->
                  <div
                    class="status-linha status-linha-final"
                    [ngClass]="'estado-' + linhaEstado(pedido, 2)"
                    [class.seta]="linhaEstado(pedido, 2) === 'atual'">
                  </div>

                  <!-- Passo 4: Entregue -->
                  <div class="status-step" [ngClass]="'estado-' + stepEstado(pedido, 3)">
                    <span class="status-sphere" aria-hidden="true"></span>
                    <span class="status-icon status-icon-entregue" aria-hidden="true"></span>
                    <span class="status-rotulo" *ngIf="stepEstado(pedido, 3) !== 'completo'">Entregue</span>
                  </div>

                </div>

                <span class="status-tempo">{{ textoStatus(pedido) }}</span>

              </div>

              <button
                type="button"
                class="acao-btn"
                [class.disponivel]="pedido.status === 'pronto'"
                [class.finalizado]="pedido.status === 'entregue'"
                [disabled]="pedido.status !== 'pronto'"
                (click)="marcarComoEntregue(pedido)">
                <span class="acao-icon" aria-hidden="true"></span>
                {{ pedido.status === 'entregue' ? 'Pedido Entregue' : 'Marcar como Entregue' }}
              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- Rodapé decorativo -->
  <div class="bottom-wrap">
    <img src="assets/imagens/pantheon-pequeno.png" alt="" class="pantheon-decoration">
    <div class="greek-border bottom"></div>
  </div>

</div>
